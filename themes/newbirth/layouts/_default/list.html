{{ define "meta_tags" }}
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Title }}{{ end }}" />
    <meta property="og:title" content="{{ .Title }}" />
    <meta property="og:type" content="{{ .Site.Params.homepage_meta_tags.meta_og_type }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:image" content='{{ "images/social.png" | absURL }}' />
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Title }}{{ end }}" />
    <meta property="og:site_name" content="{{ .Site.Params.homepage_meta_tags.meta_og_site_name }}" />
{{ end }}
